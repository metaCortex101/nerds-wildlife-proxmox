services:
  documentation:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
